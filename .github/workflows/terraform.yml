name: Terraform

# Pull requests: plan dev and prod with the read-only plan accounts.
# Merge to main: apply dev, plan prod (so the current prod plan is visible),
# then apply prod after approval in the `prod` GitHub Environment. Manual run (workflow_dispatch) on any branch: apply that branch
# to dev, to try a change before merging (D-015). See D-013 for the identities.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  WIF_PROVIDER: projects/1055929613859/locations/global/workloadIdentityPools/github/providers/huaben-tracking-platform
  SA_DOMAIN: huaben-tracking-platform-admin.iam.gserviceaccount.com
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: plan (${{ matrix.env }})
    # Fork and Dependabot runs get no OIDC token, so they can't authenticate.
    # A skipped job still satisfies the required check; Dependabot changes are
    # planned again by the apply jobs after merging.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: tf-plan-${{ matrix.env }}@${{ env.SA_DOMAIN }}

      - name: terraform init
        run: terraform init

      # The plan accounts can't write state, so they can't take the state lock.
      - name: terraform plan
        run: terraform plan -lock=false -no-color

  apply-dev:
    name: apply (dev)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: tf-apply-dev@${{ env.SA_DOMAIN }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color tfplan

  # A fresh prod plan, shown before the approval gate: the PR's plan may be
  # out of date by the time you approve. The plan is in this job's summary.
  plan-prod-before-approval:
    name: plan (prod) before approval
    needs: apply-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: tf-plan-prod@${{ env.SA_DOMAIN }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: |
          terraform plan -lock=false -no-color -out=tfplan
          {
            echo "## Prod plan to approve"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: apply (prod)
    needs: plan-prod-before-approval
    # Only from main; the `prod` Environment also restricts deployments to main
    # and waits for approval before this job starts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-apply-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: tf-apply-prod@${{ env.SA_DOMAIN }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color tfplan
