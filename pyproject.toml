[project]
name = "huaben-tracking-platform"
version = "0.1.0"
description = "Server-side tracking platform for Huaben: GTM, sGTM on Cloud Run, BigQuery, and dbt."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "contract/python/src"]
